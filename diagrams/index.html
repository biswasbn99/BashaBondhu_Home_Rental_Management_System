<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BashaBondhu DFD Architecture Viewer &amp; Exporter</title>
  <style>
    :root {
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --bg: #0F172A;
      --card: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      background: linear-gradient(135deg, #0284C7, #0D9488);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: white;
    }
    .brand h1 { font-size: 22px; font-weight: 800; }
    .brand p { font-size: 13px; color: var(--text-muted); }

    .tabs {
      display: flex;
      gap: 8px;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .action-bar {
      display: flex;
      gap: 12px;
    }
    .btn-download {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #10B981;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }
    .btn-download:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    .btn-download-all {
      background: #6366F1;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-download-all:hover {
      background: #4F46E5;
    }

    .diagram-panel {
      width: 100%;
      max-width: 1400px;
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      position: relative;
    }
    .diagram-content {
      display: none;
      width: 100%;
    }
    .diagram-content.active {
      display: block;
    }
    .diagram-content svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .meta-footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>

  <script>
    let currentTab = 0;
    const titles = [
      'BashaBondhu_Context_Level_0_DFD',
      'BashaBondhu_Level_1_DFD',
      'BashaBondhu_Level_2_KYC_Gating_DFD'
    ];

    function switchTab(index) {
      currentTab = index;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.diagram-content').forEach((diag, i) => {
        diag.classList.toggle('active', i === index);
      });
    }

    function exportSvgToJpg(svgElement, filename) {
      const xml = new XMLSerializer().serializeToString(svgElement);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const image64 = 'data:image/svg+xml;base64,' + svg64;

      const img = new Image();
      img.onload = function() {
        const scale = 2; // High-res 2x retina scale
        const canvas = document.createElement('canvas');
        canvas.width = svgElement.viewBox.baseVal.width * scale;
        canvas.height = svgElement.viewBox.baseVal.height * scale;
        const ctx = canvas.getContext('2d');
        
        // Fill pure white background for crisp JPG
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const jpgUrl = canvas.toDataURL('image/jpeg', 0.95);
        const a = document.createElement('a');
        a.download = filename + '.jpg';
        a.href = jpgUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = image64;
    }

    function downloadCurrentJpg() {
      const svg = document.getElementById('svg-' + currentTab);
      exportSvgToJpg(svg, titles[currentTab]);
    }

    function downloadAllJpgs() {
      [0, 1, 2].forEach((idx, i) => {
        setTimeout(() => {
          const svg = document.getElementById('svg-' + idx);
          exportSvgToJpg(svg, titles[idx]);
        }, i * 500);
      });
    }
  </script>
